[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kangji-server"
version = "0.1.0"
description = "康迹——单用户健康管理 Web 应用后端（FastAPI）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "sse-starlette>=2.1",
    "qdrant-client>=1.12",
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[dependency-groups]
dev = []

# 说明：不做可编辑安装（pip install -e），运行方式为在 server/ 目录下
#   uvicorn app.main:app --reload
# 依赖清单即本文件的 dependencies（安装命令见根目录 start.ps1）。
